name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend CI
        run: npm run ci

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quittr
          POSTGRES_PASSWORD: quittr
          POSTGRES_DB: quittr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quittr -d quittr_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend CI
        run: npm run ci
        env:
          DATABASE_URL: postgresql://quittr:quittr@localhost:5432/quittr_test
          JWT_SECRET: test-secret
          JWT_EXPIRATION_TIME: 7d
          SALT_ROUNDS: 10
          NODE_ENV: test
          FRONTEND_URL: http://localhost:5173